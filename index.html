<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Volumetric Accretion Disk - WebGPU (Optimized)</title>
  <style>
    html { width: 100%; height: 100%; overflow: hidden;}
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; user-select: none; }
    canvas { width: 100%; height: 100%; border: 1px solid #333; cursor: grab; filter: blur(5px) brightness(5); object-fit: cover; touch-action: none;}
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module" src="script.js"></script>
</body>
</html>
